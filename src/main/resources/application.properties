spring.application.name=ledgerline

# Set only for one operator-controlled startup after registering the chosen account.
ledgerline.admin.bootstrap-email=${LEDGERLINE_ADMIN_BOOTSTRAP_EMAIL:}
ledgerline.auditor.bootstrap-email=${LEDGERLINE_AUDITOR_BOOTSTRAP_EMAIL:}

# Credentials are required from the runtime environment for every non-test profile.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Apply versioned schema changes; Hibernate must not create or update the schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration-vendor/{vendor}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=8080

server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
