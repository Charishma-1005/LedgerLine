<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(activePage, currentEmail)" class="sidebar" id="main-sidebar" aria-label="Main navigation">
    <a class="brand" th:href="@{/}" aria-label="LedgerLine overview">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span>ledger<span class="brand-light">line</span></span>
    </a>
    <div class="workspace-label">WORKSPACE</div>
    <nav class="side-nav">
        <a class="side-link" th:classappend="${activePage == 'overview' ? ' active' : ''}" th:href="@{/}" th:attr="aria-current=${activePage == 'overview' ? 'page' : null}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
            <span>Overview</span>
        </a>
        <a class="side-link" th:classappend="${activePage == 'accounts' ? ' active' : ''}" th:href="@{/accounts}" th:attr="aria-current=${activePage == 'accounts' ? 'page' : null}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 9h18M7 15h4"/></svg>
            <span>Accounts</span>
        </a>
        <a class="side-link" th:classappend="${activePage == 'transactions' ? ' active' : ''}" th:href="@{/transactions}" th:attr="aria-current=${activePage == 'transactions' ? 'page' : null}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h13m0 0-3-3m3 3-3 3M17 17H4m0 0 3-3m-3 3 3 3"/></svg>
            <span>Transactions</span>
        </a>
        <a class="side-link" th:classappend="${activePage == 'reports' ? ' active' : ''}" th:href="@{/reports}" th:attr="aria-current=${activePage == 'reports' ? 'page' : null}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5m0 14h16M8 15v-4m4 4V7m4 8v-6m4 6V4"/></svg><span>Reports</span></a>
        <span class="side-link side-link-disabled" aria-disabled="true" title="Settings are not available yet"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19 15 1 1-3 3-1-1a2 2 0 0 0-3 1v1H9v-1a2 2 0 0 0-3-1l-1 1-3-3 1-1a2 2 0 0 0-1-3H1V9h1a2 2 0 0 0 1-3L2 5l3-3 1 1a2 2 0 0 0 3-1V1h4v1a2 2 0 0 0 3 1l1-1 3 3-1 1a2 2 0 0 0 1 3h1v4h-1a2 2 0 0 0-1 2Z"/></svg><span>Settings</span><span class="soon-badge">Soon</span></span>
    </nav>
    <div class="sidebar-bottom">
        <div class="secure-note"><span class="secure-dot"></span><span>Your money is in good order.</span></div>
        <details class="profile-menu profile-menu-side">
            <summary><span class="avatar">LL</span><span class="profile-copy"><strong>Personal account</strong><small th:text="${currentEmail}">you@example.com</small></span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></summary>
            <div class="profile-popover">
                <a th:href="@{/account}">Account</a>
                <form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Sign out securely</button></form>
            </div>
        </details>
    </div>
</aside>
</body>
</html>
